<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Rugwesh Reddy Gankidi, Data Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="270" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="270" fill="url(#bg)"/>
    <rect width="1200" height="270" fill="url(#grid)"/>

    <!-- soft moving light -->
    <circle cx="150" cy="40" r="170" fill="#38bdf8" fill-opacity="0.10">
      <animate attributeName="cx" values="150;1050;150" dur="22s" repeatCount="indefinite"/>
    </circle>

    <!-- title -->
    <text x="600" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="1">
      Rugwesh Reddy Gankidi
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="600" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#7dd3fc" letter-spacing="2">
      DATA ENGINEER  ·  STREAMING &amp; LAKEHOUSE  ·  RAG DATA LAYERS
      <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1.2s" fill="freeze"/>
    </text>

    <!-- pipeline strip -->
    <path d="M110 208 H1090" stroke="url(#line)" stroke-width="2"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
      <g>
        <rect x="140" y="190" width="120" height="36" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="200" y="213" fill="#e0f2fe">Kafka</text>
      </g>
      <g>
        <rect x="340" y="190" width="120" height="36" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="400" y="213" fill="#e0f2fe">Spark</text>
      </g>
      <g>
        <rect x="540" y="190" width="120" height="36" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="600" y="213" fill="#e0f2fe">Iceberg</text>
      </g>
      <g>
        <rect x="740" y="190" width="120" height="36" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="800" y="213" fill="#e0f2fe">pgvector</text>
      </g>
      <g>
        <rect x="940" y="190" width="120" height="36" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.7"/>
        <text x="1000" y="213" fill="#e0f2fe">RAG / AI</text>
      </g>
    </g>

    <!-- data packets flowing through the pipeline -->
    <g filter="url(#glow)" fill="#fbbf24">
      <circle r="5">
        <animateMotion dur="6s" repeatCount="indefinite" path="M110 208 H1090"/>
      </circle>
      <circle r="5">
        <animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M110 208 H1090"/>
      </circle>
      <circle r="5">
        <animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M110 208 H1090"/>
      </circle>
    </g>

    <text x="600" y="256" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7dd3fc" fill-opacity="0.8" letter-spacing="3">
      CONTRACTS · IDEMPOTENT WRITES · DEAD-LETTER HANDLING · QUALITY GATES
    </text>
  </g>
</svg>
