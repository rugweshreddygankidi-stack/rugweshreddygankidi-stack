<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-label="Skills matrix showing which technologies were used in which of five projects: Claims pipeline, Streaming lakehouse, RAG pipeline, ML-DriftNet and Job Finder">
  <style>
