        <text x="106" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#fbbf24">postings processed</text>
        <text x="106" y="120" text-anchor="middle" font-size="12" fill="#94a3b8">first 4 days of Job Finder</text>
      </g>
      <rect class="bar" x="24" y="136" width="164" height="3" rx="1.5" fill="#fbbf24" style="animation-delay:0.6s"/>
