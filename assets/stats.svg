<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Highlights: 5 end-to-end projects, 144 unit tests across two streaming pipelines, 9,830 job postings processed in 4 days, 91 percent filtered by rules, 56 percent lower held-out perplexity after fine-tuning">
  <style>
    .in { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s ease-out both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .in, .bar { animation: none !important; } }
  </style>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
