        <text x="106" y="72" text-anchor="middle" font-size="42" font-weight="800" fill="#ffffff">144</text>
        <text x="106" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#34d399">unit tests</text>
        <text x="106" y="120" text-anchor="middle" font-size="12" fill="#94a3b8">across 2 streaming pipelines</text>
      </g>
      <rect class="bar" x="24" y="136" width="164" height="3" rx="1.5" fill="#34d399" style="animation-delay:0.45s"/>
