        <text x="106" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#38bdf8">end-to-end projects</text>
        <text x="106" y="120" text-anchor="middle" font-size="12" fill="#94a3b8">streaming · RAG · ML · LLM</text>
      </g>
      <rect class="bar" x="24" y="136" width="164" height="3" rx="1.5" fill="#38bdf8" style="animation-delay:0.3s"/>
    </g>
    <g transform="translate(266 18)">
      <rect width="212" height="154" rx="14" fill="#111c30" stroke="#1e3a5f"/>
